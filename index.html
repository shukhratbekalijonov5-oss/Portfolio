<script>
/* Theme boot — resolves before first paint so there is never a flash.
   Default is dark (the portfolio's established look); the system preference
   is only consulted if the visitor has never chosen. */
(function () {
  var e = document.documentElement;
  try {
    var saved = localStorage.getItem("sa-theme");
    e.classList.add(saved === "light" ? "theme-light" : "theme-dark");
  } catch (x) { e.classList.add("theme-dark"); }
})();
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  /* Surfaces — HR Copilot dark tokens */
  --bg:            #060e1c;
  --surface:       #0b162a;
  --surface-2:     #101f3a;
  --elevated:      #081326;
  --brand-soft:    #11264e;
  --ai-tint:       #101c33;

  /* Text */
  --text:          #f0f6ff;
  --muted:         #a2b3cd;
  --subtle:        #6e82a0;
  --inverted:      #060e1c;

  /* Lines */
  --border:        #1c3054;
  --border-strong: #294470;
  --ai-line:       #2b3a63;

  /* Accents */
  --accent:        #4285ff;
  --accent-hover:  #609aff;
  --ai:            #a99dff;
  --success:       #34d399;

  --warning:       #f5c85a;
  --warning-soft:  rgba(245,200,90,0.09);
  --warning-line:  rgba(245,200,90,0.26);
  --danger:        #f87171;

  /* Chrome / overlays / depth — the values that must flip per theme */
  --nav-bg:        rgba(6,14,28,0.82);
  --menu-bg:       rgba(6,14,28,0.97);
  --well:          rgba(6,14,28,0.5);
  --overlay:       rgba(11,22,42,0.94);
  --overlay-2:     rgba(11,22,42,0.9);
  --caption-bg:    rgba(6,14,28,0.82);

  --shadow-photo:   0 16px 48px rgba(0,0,0,0.45);
  --shadow-card:    0 24px 52px rgba(0,0,0,0.42);
  --shadow-pill:    0 4px 14px rgba(0,0,0,0.4);
  --shadow-contact: 0 16px 40px rgba(0,0,0,0.4);

  --tag-key-text:  #cfe0ff;
  --tag-ai-text:   #d5cfff;
  --badge-text:    #a9c8ff;

  --grid-line:     rgba(66,133,255,0.07);
  --bloom-1:       rgba(66,133,255,0.13);
  --bloom-2:       rgba(169,157,255,0.09);
  --feature-1:     rgba(66,133,255,0.16);
  --feature-2:     rgba(169,157,255,0.08);

  /* Contextual card fill, overridden per section */
  --card: var(--surface);

  --shell: 1100px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ═══ LIGHT THEME ═══
   Same tokens, same roles, same identity — only the values change.
   Dark lives on :root above and is never touched by this block. */
html.theme-light{
  --bg:            #f7faff;
  --surface:       #ffffff;
  --surface-2:     #eef4ff;
  --elevated:      #eef4ff;
  --brand-soft:    #eaf1ff;
  --ai-tint:       #f1f0ff;

  --text:          #0f172a;
  --muted:         #5b6b84;
  --subtle:        #7c8ca5;
  --inverted:      #ffffff;

  --border:        #d9e4f5;
  --border-strong: #c4d4eb;
  --ai-line:       #d6d2f5;

  --accent:        #3b6ef5;
  --accent-hover:  #2f5be3;
  --ai:            #6d5fe0;
  --success:       #16a34a;

  --warning:       #d97706;
  --warning-soft:  rgba(217,119,6,0.08);
  --warning-line:  rgba(217,119,6,0.28);
  --danger:        #dc2626;

  --nav-bg:        rgba(247,250,255,0.85);
  --menu-bg:       rgba(247,250,255,0.97);
  --well:          #eef4ff;
  --overlay:       rgba(255,255,255,0.94);
  --overlay-2:     rgba(255,255,255,0.92);
  --caption-bg:    rgba(15,23,42,0.82);   /* sits on screenshots — stays dark in both */

  --shadow-photo:   0 16px 40px rgba(15,23,42,0.10);
  --shadow-card:    0 18px 40px rgba(15,23,42,0.08);
  --shadow-pill:    0 4px 14px rgba(15,23,42,0.10);
  --shadow-contact: 0 16px 36px rgba(15,23,42,0.09);

  --tag-key-text:  #2f5be3;
  --tag-ai-text:   #5b4dd1;
  --badge-text:    #2f5be3;

  --grid-line:     rgba(59,110,245,0.06);
  --bloom-1:       rgba(59,110,245,0.07);
  --bloom-2:       rgba(59,110,245,0.05);
  --feature-1:     rgba(59,110,245,0.10);
  --feature-2:     rgba(59,110,245,0.04);
}

/* Cards stay white in light mode; the soft blue moves to the section band,
   preserving the dark theme's alternating rhythm. */
html.theme-light .section--raised { background: var(--surface-2); --card: var(--surface); }

/* Small accent-coloured text sits at 4.24:1 on #f7faff with the spec accent.
   Nudging only the small text to the palette's own #2f5be3 lifts it to 5.2:1.
   Fills, borders, icons and large display text keep the spec accent #3b6ef5. */
html.theme-light .section-eyebrow,
html.theme-light .hero-tagline .hl,
html.theme-light .hero-role .hl,
html.theme-light .hero-handle a:hover,
html.theme-light .nav-logo span,
html.theme-light .nav-links a:hover,
html.theme-light .nav-links a.active,
html.theme-light .exp-tag,
html.theme-light .exp-badge--blue,
html.theme-light .exp-bullets li::before,
html.theme-light .case > summary,
html.theme-light .case-block li::before,
html.theme-light .proj-why-label,
html.theme-light .proj-badge--colored,
html.theme-light a.proj-ext-link,
html.theme-light .edu-years,
html.theme-light .lang-level,
html.theme-light .site-footer a:hover { color: #2f5be3; }

html { scroll-behavior: smooth; scroll-padding-top: 5rem; }

body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* ── BACKGROUND: 32px grid + radial bloom (fixed, behind everything) ── */
body::before{
  content:'';
  position: fixed; inset: 0; z-index: -2;
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.55) 45%, transparent 88%);
          mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.55) 45%, transparent 88%);
  pointer-events: none;
}
body::after{
  content:'';
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(60rem 32rem at 12% -8%, var(--bloom-1), transparent 62%),
    radial-gradient(48rem 26rem at 92% 4%, var(--bloom-2), transparent 60%);
  pointer-events: none;
}

::selection { background: rgba(66,133,255,0.28); color: #fff; }

a { color: inherit; }

/* ── NAV ── */
nav{
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.1rem 4rem;
  background: var(--nav-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.nav-logo{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--text); text-decoration: none;
}
.nav-logo span { color: var(--accent); }

.nav-links { display: flex; gap: 2.2rem; list-style: none; }
.nav-links a{
  color: var(--muted); text-decoration: none;
  font-size: 0.86rem; font-weight: 500; letter-spacing: 0.01em;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--accent); }

.nav-right { display: flex; align-items: center; gap: 0.9rem; }

.lang-switcher{
  display: flex; border: 1.5px solid var(--border); border-radius: 6px;
  overflow: hidden; font-size: 0.78rem; font-weight: 600;
}
.lang-btn{
  padding: 0.38rem 0.75rem; cursor: pointer; white-space: nowrap; background: transparent; border: none;
  color: var(--muted); font-family: inherit; font-size: 0.78rem; font-weight: 600;
  transition: background 0.15s, color 0.15s;
}
.lang-btn.active { background: var(--accent); color: #fff; }
.lang-btn:not(.active):hover { background: var(--surface-2); color: var(--text); }

.btn-hire{
  background: var(--accent); color: #fff; text-decoration: none;
  font-weight: 600; font-size: 0.86rem; padding: 0.52rem 1.4rem;
  border-radius: 6px; transition: background 0.2s, box-shadow 0.2s;
}
.btn-hire:hover { background: var(--accent-hover); box-shadow: 0 0 18px rgba(66,133,255,0.35); }

#themeBtn{
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 34px; flex-shrink: 0;
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
#themeBtn:hover { color: var(--accent); border-color: var(--accent); background: var(--brand-soft); }
#themeBtn .ico-moon { display: none; }
html.theme-light #themeBtn .ico-moon { display: block; }
html.theme-light #themeBtn .ico-sun  { display: none; }

/* Visible keyboard focus everywhere */
:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.nav-burger{
  display: none; background: transparent; border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); width: 36px; height: 34px;
  cursor: pointer; align-items: center; justify-content: center;
}
#navMobile{
  position: fixed; top: 61px; left: 0; right: 0; z-index: 99;
  background: var(--menu-bg);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  max-height: 0; overflow: hidden; transition: max-height 0.35s var(--ease);
}
#navMobile.open { max-height: 26rem; }
#navMobile a{
  display: block; padding: 0.9rem 1.5rem; text-decoration: none;
  color: var(--muted); font-size: 0.9rem; font-weight: 500;
  border-bottom: 1px solid var(--border);
}
#navMobile a:last-child { border-bottom: none; }

/* ── SHARED SECTION SHELL ── */
.section{
  border-top: 1px solid var(--border);
  padding: 6rem 2rem;
}
.section--raised { background: var(--surface); --card: var(--surface-2); }
.section-inner { max-width: var(--shell); margin: 0 auto; }

.section-eyebrow{
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem;
}
.section-title{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif;
  font-size: clamp(2rem, 4vw, 3rem); font-weight: 800;
  color: var(--text); line-height: 1.1; margin-bottom: 1rem;
}
.section-lede{
  font-size: 0.94rem; color: var(--muted); line-height: 1.8;
  max-width: 620px; margin-bottom: 3rem;
}

/* ── PILL / TAG ── */
.tag{
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.78rem; font-weight: 400;
  padding: 0.3rem 0.75rem; border-radius: 20px;
  max-width: 100%; overflow-wrap: anywhere;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.tag:hover { border-color: var(--border-strong); color: var(--text); }
.tag--key { color: var(--tag-key-text); border-color: rgba(66,133,255,0.32); background: rgba(66,133,255,0.07); }
.tag--key:hover { border-color: var(--accent); }
.tag--ai  { color: var(--tag-ai-text); border-color: rgba(169,157,255,0.32); background: rgba(169,157,255,0.07); }
.tag--ai:hover { border-color: var(--ai); }

/* ── SCROLL REVEAL ── */
.reveal{
  opacity: 0; transform: translateY(22px);
  transition: opacity 0.75s var(--ease), transform 0.75s var(--ease);
}
.reveal.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce){
  html { scroll-behavior: auto; }
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* ── HERO ── */
#hero{
  min-height: 100vh; max-width: var(--shell); margin: 0 auto;
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 4rem;
  padding: 7rem 2rem 4rem;
}

.status-badge{
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(66,133,255,0.08);
  border: 1px solid rgba(66,133,255,0.22);
  color: var(--badge-text);
  font-size: 0.8rem; font-weight: 500;
  padding: 0.42rem 1.1rem; border-radius: 20px; margin-bottom: 1.8rem;
}
.status-dot{
  width: 7px; height: 7px; flex-shrink: 0;
  background: var(--success); border-radius: 50%;
  box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

.hero-name{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif;
  font-size: clamp(2.6rem, 5.2vw, 4.6rem);
  font-weight: 800; line-height: 1.04; letter-spacing: -0.02em;
  color: var(--text); margin-bottom: 1rem;
}
.hero-name em { font-style: normal; color: var(--accent); display: block; }

.hero-handle{
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.8rem; color: var(--subtle); margin-bottom: 1.6rem;
}
.hero-handle a { color: var(--subtle); text-decoration: none; transition: color 0.2s; }
.hero-handle a:hover { color: var(--accent); }
.hero-handle .sep { color: var(--border-strong); margin: 0 0.55rem; }

.hero-role{
  font-size: 1.02rem; font-weight: 600; color: var(--text);
  margin-bottom: 0.9rem; line-height: 1.5;
}
.hero-tagline{
  font-size: 0.95rem; color: var(--muted); line-height: 1.82;
  max-width: 540px; margin-bottom: 2.2rem;
}
.hero-tagline strong { color: var(--text); font-weight: 600; }
.hero-tagline .hl, .hero-role .hl { color: var(--accent); font-weight: 600; }

.hero-cta { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.6rem; }

.btn-primary{
  background: var(--accent); color: #fff; text-decoration: none;
  font-weight: 600; font-size: 0.88rem; padding: 0.72rem 1.7rem; border-radius: 6px;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}
.btn-primary:hover{
  background: var(--accent-hover); transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(66,133,255,0.28);
}
.btn-outline{
  border: 1.5px solid var(--border-strong); color: var(--text); background: var(--surface);
  text-decoration: none; font-weight: 500; font-size: 0.88rem;
  padding: 0.72rem 1.7rem; border-radius: 6px;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  display: inline-flex; align-items: center; gap: 0.45rem;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--brand-soft); }

.hero-socials { display: flex; gap: 0.6rem; margin-bottom: 2.6rem; }
.social-link{
  width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); text-decoration: none;
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
}
.social-link:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

.hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
.stat-card{
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.85rem 0.7rem; min-width: 0; text-align: center;
  transition: border-color 0.25s, transform 0.25s;
}
.stat-card:hover { border-color: var(--border-strong); transform: translateY(-3px); }
.stat-number{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif; font-size: 2rem; font-weight: 700;
  color: var(--accent); line-height: 1; display: block;
}
.stat-label{
  font-size: 0.68rem; color: var(--subtle); margin-top: 0.35rem;
  text-transform: uppercase; letter-spacing: 0.05em; display: block; line-height: 1.4;
}

/* ── HERO PORTRAIT FRAME ── */
.hero-photo-wrap { display: flex; align-items: center; justify-content: center; }
.photo-outer-frame { position: relative; padding: 14px; }
.photo-outer-frame::before, .photo-outer-frame::after{
  content:''; position: absolute; width: 36px; height: 36px;
  border-color: var(--accent); border-style: solid; opacity: 0.55;
}
.photo-outer-frame::before { top: 0; left: 0; border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
.photo-outer-frame::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }
.photo-inner-frame { position: relative; }
.photo-inner-frame::before, .photo-inner-frame::after{
  content:''; position: absolute; width: 36px; height: 36px;
  border-color: var(--accent); border-style: solid; opacity: 0.55; z-index: 2;
}
.photo-inner-frame::before { top: -14px; right: -14px; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
.photo-inner-frame::after  { bottom: -14px; left: -14px; border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }

.photo-img-wrap{
  border: 2px solid var(--border); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow-photo); position: relative;
  width: 310px; height: 400px;
  background: linear-gradient(160deg, var(--surface-2), var(--elevated));
  display: flex; align-items: center; justify-content: center;
}
.photo-img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

/* Monogram fallback shown until a real photo is dropped in */
.photo-monogram{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif; font-size: 5.4rem; font-weight: 800;
  background: linear-gradient(140deg, var(--accent), var(--ai));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: -0.03em; user-select: none;
}
.photo-monogram-hint{
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
  color: var(--subtle); letter-spacing: 0.08em; white-space: nowrap;
}

.photo-badge{
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: var(--overlay); border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 0.45rem 1rem;
  display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;
  box-shadow: var(--shadow-pill);
}
.photo-badge-text { font-size: 0.76rem; color: var(--text); font-weight: 500; }

/* ── ABOUT ── */
.about-inner{
  max-width: var(--shell); margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start;
}
.about-body { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 0.5rem; }
.about-body p { font-size: 0.95rem; color: var(--muted); line-height: 1.85; }
.about-body strong { color: var(--text); font-weight: 600; }

.about-card{
  display: flex; gap: 1rem; align-items: flex-start;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.1rem 1.2rem; margin-bottom: 0.9rem;
  transition: border-color 0.25s, transform 0.25s;
}
.about-card:last-child { margin-bottom: 0; }
.about-card:hover { border-color: var(--border-strong); transform: translateX(3px); }
.about-card-icon{
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 0.1rem;
}
.ic--blue   { background: rgba(66,133,255,0.12);  color: var(--accent); }
.ic--violet { background: rgba(169,157,255,0.12); color: var(--ai); }
.ic--green  { background: rgba(52,211,153,0.12);  color: var(--success); }
.ic--slate  { background: rgba(162,179,205,0.10); color: var(--muted); }

.about-card-title { font-size: 0.92rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; }
.about-card-desc  { font-size: 0.82rem; color: var(--muted); line-height: 1.65; }

/* ── TECH STACK ── */
/* align-items:start so each card hugs its own chip count instead of
   stretching to the tallest card in the row (avoids large empty wells) */
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; align-items: start; }
.skill-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.6rem 1.5rem;
  transition: border-color 0.25s, transform 0.25s;
}
.skill-card:hover { border-color: var(--border-strong); transform: translateY(-3px); }
.skill-card--primary { border-color: rgba(66,133,255,0.28); }
.skill-card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.2rem; }
.skill-icon{
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.skill-card-title { font-size: 1rem; font-weight: 600; color: var(--text); }
.skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }

/* ── JOURNEY (experience) ── */
.exp-list { display: flex; flex-direction: column; gap: 2rem; }
.exp-item { display: grid; grid-template-columns: 200px 1fr; gap: 2rem; align-items: start; }
.exp-meta { display: flex; flex-direction: column; gap: 0.5rem; padding-top: 1.6rem; }
.exp-badge{
  display: inline-block; background: rgba(52,211,153,0.10); color: var(--success);
  border: 1px solid rgba(52,211,153,0.22);
  font-size: 0.72rem; font-weight: 600; padding: 0.3rem 0.8rem;
  border-radius: 20px; width: fit-content; letter-spacing: 0.02em;
}
.exp-badge--blue   { background: rgba(66,133,255,0.09);  color: var(--accent); border-color: rgba(66,133,255,0.24); }
.exp-badge--violet { background: rgba(169,157,255,0.09); color: var(--ai);     border-color: rgba(169,157,255,0.24); }
.exp-badge--muted  { background: rgba(162,179,205,0.07); color: var(--muted);  border-color: var(--border); }
.exp-anchor{
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem; color: var(--subtle); line-height: 1.6;
}

.exp-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.8rem 2rem;
  transition: border-color 0.25s;
}
.exp-card:hover { border-color: var(--border-strong); }
.exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
.exp-role { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 0.2rem; }
.exp-company { font-size: 0.85rem; color: var(--subtle); }
.exp-tag{
  background: rgba(66,133,255,0.08); color: var(--accent);
  border: 1px solid rgba(66,133,255,0.2);
  font-size: 0.72rem; font-weight: 600; padding: 0.3rem 0.8rem;
  border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.exp-summary { font-size: 0.9rem; color: var(--muted); line-height: 1.78; margin-bottom: 1rem; }
.exp-summary strong { color: var(--text); font-weight: 600; }
.exp-bullets { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
.exp-bullets li{
  font-size: 0.86rem; color: var(--muted); line-height: 1.7;
  padding-left: 1.1rem; position: relative;
}
.exp-bullets li::before{
  content: '–'; position: absolute; left: 0; color: var(--accent); font-weight: 600;
}
.exp-bullets li strong { color: var(--text); font-weight: 600; }

/* ── PROJECTS ── */
.projects-list { display: flex; flex-direction: column; gap: 1.4rem; }

.proj-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 2rem; position: relative; overflow: hidden;
  transition: transform 0.25s var(--ease), border-color 0.25s, box-shadow 0.25s;
}
.proj-card:hover{
  transform: translateY(-5px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-card);
}
.proj-card--featured::before{
  content:''; position: absolute; top: 0; left: 0; right: 0; height: 220px;
  background: linear-gradient(155deg, var(--feature-1) 0%, var(--feature-2) 45%, transparent 78%);
  pointer-events: none; border-radius: 16px 16px 0 0; z-index: 0;
}
.proj-card--featured > * { position: relative; z-index: 1; }

.proj-wide-inner{
  display: grid; grid-template-columns: 45fr 55fr; gap: 2rem;
  align-items: stretch; min-width: 0;
}
.proj-wide-left  { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
.proj-wide-right{
  display: flex; flex-direction: column; gap: 1.4rem;
  min-width: 0; align-items: stretch;
}
.proj-wide-right .proj-slideshow{
  width: 100%; aspect-ratio: 16/10; height: auto; min-height: 0;
  background: var(--elevated); flex-shrink: 0;
}
.proj-wide-right .slideshow-track { height: 100%; }
.proj-wide-right .slide-img{
  width: 100%; height: 100%; min-width: 100%; flex-shrink: 0;
  object-fit: cover; object-position: top center;
  background: var(--elevated);
}

.proj-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.proj-wide-left .proj-card-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
.proj-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.proj-badge{
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.73rem; font-weight: 500; padding: 0.32rem 0.85rem;
  border-radius: 20px; border: 1px solid var(--border);
  color: var(--muted); background: var(--bg);
}
.proj-badge--colored { background: rgba(66,133,255,0.07); border-color: rgba(66,133,255,0.2); color: var(--accent); }
.proj-badge--star    { background: var(--warning-soft); border-color: var(--warning-line); color: var(--warning); }

.proj-ext-link{
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.9rem; border: 1px solid var(--border); border-radius: 8px;
  color: var(--muted); text-decoration: none; font-size: 0.76rem; font-weight: 600;
  white-space: nowrap; flex-shrink: 0;
  transition: border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.3s;
}
a.proj-ext-link{
  background: linear-gradient(135deg, rgba(66,133,255,0.09), rgba(169,157,255,0.09));
  border-color: rgba(66,133,255,0.32); color: var(--accent);
  animation: visitPulse 2.8s ease-in-out infinite;
}
a.proj-ext-link:hover{
  box-shadow: 0 0 16px rgba(66,133,255,0.4); border-color: var(--accent);
  transform: translateY(-1px); animation: none;
}
@keyframes visitPulse{
  0%,100% { box-shadow: 0 0 0 0 rgba(66,133,255,0); border-color: rgba(66,133,255,0.32); }
  50%     { box-shadow: 0 0 12px rgba(66,133,255,0.3); border-color: rgba(66,133,255,0.65); }
}

.proj-title{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif; font-size: 1.6rem; font-weight: 700;
  color: var(--text); line-height: 1.2;
}
.proj-card--featured .proj-title { font-size: 2rem; }
.proj-overview { font-size: 0.89rem; color: var(--muted); line-height: 1.8; }
.proj-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.proj-highlights { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
.proj-highlights li{
  font-size: 0.85rem; color: var(--muted); line-height: 1.7;
  padding-left: 1.2rem; position: relative;
}
.proj-highlights li::before{
  content: ''; position: absolute; left: 0; top: 0.62em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}

/* Placeholder slot for projects with no screenshots yet */
.proj-image-slot{
  background: var(--bg); border: 1.5px dashed var(--border-strong); border-radius: 10px;
  aspect-ratio: 16/10; display: flex; flex-direction: column; gap: 0.4rem;
  align-items: center; justify-content: center;
  color: var(--subtle); font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem; letter-spacing: 0.04em; text-align: center; padding: 1rem;
}
.proj-image-slot span { font-size: 0.68rem; color: var(--border-strong); }

/* ── CASE STUDY (accordion) ── */
.case{
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--well); overflow: hidden;
}
.case > summary{
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 0.9rem 1.2rem;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); transition: background 0.2s;
}
.case > summary::-webkit-details-marker { display: none; }
.case > summary:hover { background: var(--brand-soft); }
.case[open] > summary { border-bottom: 1px solid var(--border); }
.case-chevron { transition: transform 0.3s var(--ease); flex-shrink: 0; }
.case[open] .case-chevron { transform: rotate(180deg); }
.case-body { padding: 1.4rem 1.2rem; display: grid; gap: 1.3rem; }
.case-block-label{
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--subtle); margin-bottom: 0.45rem;
}
.case-block p, .case-block li { font-size: 0.85rem; color: var(--muted); line-height: 1.75; }
.case-block ul { list-style: none; display: flex; flex-direction: column; gap: 0.45rem; }
.case-block li { padding-left: 1.1rem; position: relative; }
.case-block li::before { content: '–'; position: absolute; left: 0; color: var(--accent); }
.case-block strong { color: var(--text); font-weight: 600; }
@media (min-width: 761px){ .case-body { grid-template-columns: 1fr 1fr; } }

/* ── WHY THESE TECHNOLOGIES ── */
.proj-why-label{
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 0.6rem;
}
.proj-why-list { display: flex; flex-direction: column; gap: 0.7rem; }
.proj-why-item { font-size: 0.83rem; color: var(--muted); line-height: 1.7; }
.proj-why-item strong { color: var(--text); font-weight: 600; }

/* ── SLIDESHOW ── */
.proj-slideshow{
  position: relative; border-radius: 10px; overflow: hidden;
  background: var(--elevated); border: 1px solid var(--border);
  aspect-ratio: 16/9; user-select: none;
}
.slideshow-track{
  display: flex; width: 100%; height: 100%;
  transition: transform 0.4s var(--ease);
}
.slide-img{
  min-width: 100%; width: 100%; height: 100%;
  object-fit: cover; object-position: top; flex-shrink: 0;
}
.slide-btn{
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px;
  background: var(--overlay-2); border: 1px solid var(--border-strong);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text);
  transition: background 0.2s, transform 0.2s; z-index: 10;
}
.slide-btn:hover { background: var(--surface-2); transform: translateY(-50%) scale(1.08); }
.slide-btn--prev { left: 10px; }
.slide-btn--next { right: 10px; }

.slide-dots{
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 10;
}
.slide-dot{
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(240,246,255,0.35); border: 1px solid rgba(240,246,255,0.6);
  cursor: pointer; padding: 0;
  transition: background 0.2s, transform 0.2s;
}
.slide-dot.active { background: #fff; transform: scale(1.25); }

.slide-caption{
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--caption-bg); border: 1px solid var(--border);
  color: #f0f6ff; font-size: 0.7rem;
  padding: 0.24rem 0.7rem; border-radius: 10px; white-space: nowrap;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10;
}
.proj-slideshow:hover .slide-caption { opacity: 1; }

/* ── PRODUCTION / DEVOPS ── */
.prod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
.prod-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.5rem;
  transition: border-color 0.25s, transform 0.25s;
}
.prod-card:hover { border-color: var(--border-strong); transform: translateY(-3px); }
.prod-card-head { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; }
.prod-card-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
.prod-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.prod-list li{
  font-size: 0.82rem; color: var(--muted); line-height: 1.65;
  padding-left: 1.05rem; position: relative;
}
.prod-list li::before{
  content: ''; position: absolute; left: 0; top: 0.6em;
  width: 4px; height: 4px; border-radius: 50%; background: var(--success);
}
.prod-note{
  margin-top: 1.6rem; font-size: 0.8rem; color: var(--subtle); line-height: 1.7;
  border-left: 2px solid var(--border-strong); padding-left: 0.9rem;
}

/* ── EDUCATION & LANGUAGES ── */
/* heading sits directly above the grid here (no lede), matching the reference rhythm */
#education .section-title { margin-bottom: 3rem; }
.edu-eyebrow{
  display: inline-block;
  background: rgba(66,133,255,0.09);
  padding: 0.22rem 0.65rem;
  border-radius: 4px;
}
.edu-icon{
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(66,133,255,0.12); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 0.1rem;
}
.edu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-bottom: 2.5rem; }
.edu-card{
  display: flex; gap: 1rem; align-items: flex-start;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.6rem 1.5rem;
  transition: border-color 0.25s;
}
.edu-card:hover { border-color: var(--border-strong); }
.edu-title  { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 0.35rem; }
.edu-school { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; line-height: 1.5; }
.edu-years  { font-size: 0.8rem; color: var(--accent); font-weight: 600; letter-spacing: 0.01em; }

.lang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.lang-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 1.4rem 1rem; text-align: center;
  transition: border-color 0.25s, transform 0.25s;
}
.lang-card:hover { border-color: var(--border-strong); transform: translateY(-3px); }
.lang-name  { font-size: 0.96rem; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
.lang-level { font-size: 0.82rem; font-weight: 600; color: var(--accent); }

/* ── CONTACT ── */
.contact-section { text-align: center; }
.contact-inner { max-width: 900px; margin: 0 auto; }
.contact-title{
  font-family: 'Playfair Display', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', serif;
  font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800;
  color: var(--text); line-height: 1.1; margin: 0.5rem 0 1rem;
}
.contact-sub{
  font-size: 0.95rem; color: var(--muted); line-height: 1.75;
  max-width: 520px; margin: 0 auto 3rem;
}
.contact-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.contact-card{
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.7rem 1.1rem; text-decoration: none; color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
  transition: transform 0.22s var(--ease), border-color 0.22s, box-shadow 0.22s;
}
.contact-card:hover{
  transform: translateY(-4px); border-color: var(--accent);
  box-shadow: var(--shadow-contact);
}
.contact-card--static { cursor: default; }
.contact-card--static:hover { transform: none; border-color: var(--border); box-shadow: none; }
.contact-icon{
  width: 44px; height: 44px; background: rgba(66,133,255,0.1); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); margin-bottom: 0.35rem;
}
.contact-card-label{
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--subtle);
}
.contact-card-value{
  font-size: 0.85rem; font-weight: 600; color: var(--text); word-break: break-word;
}
.contact-status{
  display: inline-flex; align-items: center; gap: 0.55rem;
  background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.25);
  color: var(--success); font-size: 0.82rem; font-weight: 500;
  padding: 0.6rem 1.4rem; border-radius: 30px;
}

/* ── FOOTER ── */
.site-footer{
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 1.4rem 4rem;
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  font-size: 0.8rem; color: var(--subtle);
}
.site-footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
.site-footer a:hover { color: var(--accent); }

/* ── RESPONSIVE ── */
@media (max-width: 1000px){
  .skills-grid, .prod-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px){
  nav { padding: 1rem 1.5rem; }
  .nav-links { display: none; }
  .nav-burger { display: flex; }
  .btn-hire { display: none; }
  .section { padding: 4.5rem 1.5rem; }
  .about-inner { grid-template-columns: 1fr; gap: 3rem; }
  .edu-grid { grid-template-columns: 1fr; }
  .lang-grid { grid-template-columns: repeat(2, 1fr); }
  .contact-cards { grid-template-columns: repeat(2, 1fr); }
  #hero{
    grid-template-columns: 1fr; padding: 6rem 1.5rem 4rem; gap: 2.5rem; text-align: center;
  }
  .hero-tagline { margin-left: auto; margin-right: auto; }
  .hero-cta, .hero-stats, .hero-socials { justify-content: center; }
  .hero-photo-wrap { order: -1; }
  .photo-img-wrap { width: 240px; height: 300px; }
  .photo-monogram { font-size: 4rem; }
}
@media (max-width: 760px){
  .exp-item { grid-template-columns: 1fr; gap: 0.7rem; }
  .exp-meta { padding-top: 0; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .exp-card { padding: 1.3rem; }
  .exp-header { flex-direction: column; gap: 0.5rem; }
  .proj-wide-inner { grid-template-columns: 1fr; }
  .proj-wide-right { gap: 1.1rem; }
  .proj-card { padding: 1.4rem; }
  .proj-card--featured .proj-title { font-size: 1.6rem; }
  .site-footer { flex-direction: column; text-align: center; padding: 1.2rem; }
  .proj-card-header { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 520px){
  nav { padding: 0.9rem 1rem; gap: 0.5rem; }
  .nav-logo { font-size: 0.95rem; }
  .nav-right { gap: 0.5rem; }
  .lang-btn { padding: 0.34rem 0.5rem; font-size: 0.72rem; }
  #themeBtn, .nav-burger { width: 32px; height: 31px; }
}
@media (max-width: 580px){
  .skills-grid, .prod-grid { grid-template-columns: 1fr; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
  .lang-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>
  <nav>
    <a href="#hero" class="nav-logo">Shukhratbek <span>Alijonov</span></a>
    <ul class="nav-links" id="navLinks"></ul>
    <div class="nav-right">
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="ko" type="button" lang="ko">한국어</button>
        <button class="lang-btn" data-lang="uz" type="button">UZ</button>
      </div>
      <button id="themeBtn" type="button" aria-label="Toggle theme">
        <svg class="ico-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg class="ico-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <a class="btn-hire" id="hireBtn" href="#contact">Hire Me</a>
      <button class="nav-burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>
  <div id="navMobile"></div>

  <main>
    <section id="hero"></section>
    <section id="about"      class="section section--raised"></section>

                  <div>
                    <h3 class="exp-role">${t(x.role)}</h3>
                    ${x.context ? `<p class="exp-company">${t(x.context)}</p>` : ""}
                  </div>
                  <span class="exp-tag">${t(x.tag)}</span>
                </div>
                ${x.summary ? `<p class="exp-summary">${t(x.summary)}</p>` : ""}
                <ul class="exp-bullets">${x.bullets.map((b) => `<li>${t(b)}</li>`).join("")}</ul>
              </div>
            </article>`).join("")}
        </div>
      </div>`;
  }
  function renderExperience() { renderExpSection("experience", DATA.experience); }
  function renderJourney()    { renderExpSection("journey",    DATA.journey); }

  /* ---------- PROJECTS ---------- */
  function media(p, L) {
    if (p.shots && p.shots.length) {
      return `
        <div class="proj-slideshow" data-show="${p.id}">
          <div class="slideshow-track" id="${p.id}Track"></div>
          ${p.shots.length > 1 ? `
            <button class="slide-btn slide-btn--prev" type="button" aria-label="Previous" data-slide="${p.id}" data-dir="-1">${svg("chev", 16)}</button>
            <button class="slide-btn slide-btn--next" type="button" aria-label="Next" data-slide="${p.id}" data-dir="1">${svg("chev", 16)}</button>
            <div class="slide-dots" id="${p.id}Dots"></div>` : ""}
          <div class="slide-caption" id="${p.id}Caption"></div>
        </div>`;
    }
    return `<div class="proj-image-slot">${t(L.noShots)}<span>${t(L.addShots)}</span></div>`;
  }

  function caseStudy(p, L) {
    const c = p.caseStudy;
    if (!c) return "";
    const block = (label, content) =>
      `<div class="case-block"><p class="case-block-label">${t(label)}</p>${content}</div>`;
    const list = (arr) => `<ul>${arr.map((i) => `<li>${t(i)}</li>`).join("")}</ul>`;

    return `
      <details class="case">
        <summary>${t(L.case)} ${svg("chev", 15).replace("<svg", '<svg class="case-chevron"')}</summary>
        <div class="case-body">
          ${block(L.problem,  `<p>${t(c.problem)}</p>`)}
          ${block(L.solution, `<p>${t(c.solution)}</p>`)}
          ${block(L.arch,     `<p>${t(c.architecture)}</p>`)}
          ${block(L.role,     `<p>${t(c.role)}</p>`)}
          ${block(L.chall,    list(c.challenges))}
          ${block(L.prod,     list(c.production))}
          ${block(L.outcome,  `<p>${t(c.outcome)}</p>`)}
        </div>
      </details>`;
  }

  function projectCard(p, L) {
    const links = [
      p.url  ? `<a class="proj-ext-link" href="${p.url}" target="_blank" rel="noopener noreferrer">${t(L.visit)} ${svg("ext", 13)}</a>` : "",
      p.repo ? `<a class="proj-ext-link" href="${p.repo}" target="_blank" rel="noopener noreferrer" style="animation:none;background:var(--bg);border-color:var(--border);color:var(--muted)">${svg("github", 13)} ${t(L.code)}</a>` : ""
    ].join("");

    const body = `
      <div class="proj-card-header">
        <div class="proj-badges">
          ${p.featured ? `<span class="proj-badge proj-badge--star">★ ${t(p.star)}</span>` : ""}
          <span class="proj-badge proj-badge--colored">${t(p.badge)}</span>
          ${p.role ? `<span class="proj-badge">${t(p.role)}</span>` : ""}
        </div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">${links}</div>
      </div>
      <h3 class="proj-title">${p.title}</h3>
      <p class="proj-overview">${t(p.overview)}</p>
      <ul class="proj-highlights">${p.highlights.map((h) => `<li>${t(h)}</li>`).join("")}</ul>
      <div class="proj-tags">${tags(p.tags.key, "tag--key")}${tags(p.tags.rest)}</div>`;

    const why = p.why && p.why.length ? `
      <div>
        <p class="proj-why-label">${t(L.why)}</p>
        <div class="proj-why-list">
          ${p.why.map((w) => `<p class="proj-why-item"><strong>${w.tech}</strong> — ${t(w.reason)}</p>`).join("")}
        </div>
      </div>` : "";

    if (!p.wide) {
      return `<article class="proj-card reveal" style="display:flex;flex-direction:column;gap:1.1rem">
                ${body}${why}${caseStudy(p, L)}
              </article>`;
    }

    const cs = caseStudy(p, L);
    return `
      <article class="proj-card reveal ${p.featured ? "proj-card--featured" : ""}">
        <div class="proj-wide-inner">
          <div class="proj-wide-left">${body}</div>
          <div class="proj-wide-right">${media(p, L)}${why}</div>
        </div>
        ${cs ? `<div style="margin-top:1.4rem">${cs}</div>` : ""}
      </article>`;
  }

  function renderProjects() {
    const pr = DATA.projects;
    el("projects").innerHTML = `
      <div class="section-inner">
        ${heading(pr.eyebrow, pr.title, pr.lede)}
        <div class="projects-list">${pr.items.map((p) => projectCard(p, pr.labels)).join("")}</div>
      </div>`;
  }

  /* ---------- PRODUCTION ---------- */
  function renderProduction() {
    const pd = DATA.production;
    el("production").innerHTML = `
      <div class="section-inner">
        ${heading(pd.eyebrow, pd.title, pd.lede)}
        <div class="prod-grid">
          ${pd.groups.map((g, i) => `
            <div class="prod-card reveal" style="transition-delay:${(i % 3) * 70}ms">
              <div class="prod-card-head">
                <div class="skill-icon ic--${g.tone}">${svg(g.icon, 17)}</div>
                <h3 class="prod-card-title">${t(g.title)}</h3>
              </div>
              <ul class="prod-list">${g.items.map((x) => `<li>${t(x)}</li>`).join("")}</ul>
            </div>`).join("")}
        </div>
        <p class="prod-note reveal">${t(pd.note)}</p>
      </div>`;
  }

  /* ---------- EDUCATION ---------- */
  function renderEducation() {
    const e = DATA.education;
    el("education").innerHTML = `
      <div class="section-inner">
        <p class="section-eyebrow edu-eyebrow reveal">${t(e.eyebrow)}</p>
        <h2 class="section-title reveal">${t(e.title)}</h2>
        <div class="edu-grid">
          ${e.schools.map((s, i) => `
            <div class="edu-card reveal" style="transition-delay:${i * 70}ms">
              <div class="edu-icon">${svg("gradcap", 18)}</div>
              <div>
                <h4 class="edu-title">${t(s.program)}</h4>
                <p class="edu-school">${t(s.school)}</p>
                <p class="edu-years">${t(s.years)}</p>
              </div>
            </div>`).join("")}
        </div>
        <div class="lang-grid">
          ${e.languages.map((l, i) => `
            <div class="lang-card reveal" style="transition-delay:${i * 60}ms">
              <h4 class="lang-name">${t(l.name)}</h4>
              <p class="lang-level">${t(l.level)}</p>
            </div>`).join("")}
        </div>
      </div>`;
  }

  /* ---------- CONTACT ---------- */
  function renderContact() {
    const c = DATA.contact, m = DATA.meta;
    const cards = [
      { icon: "mail",  label: c.labels.email,    value: m.email.replace("@", "@<wbr>"), href: "mailto:" + m.email },
      { icon: "phone", label: c.labels.phone,    value: m.phone,      href: m.phoneHref },
      { icon: "github", label: c.labels.github,
        // derived from meta.github.url so there is one source of truth;
        // <wbr> lets it break after the slash instead of mid-handle
        value: m.github.url.replace(/^https?:\/\//, "").replace("/", "/<wbr>"),
        href: m.github.url, ext: true },
      { icon: "pin",   label: c.labels.location, value: t(m.location) }
    ];

    el("contact").innerHTML = `
      <div class="contact-inner">
        <p class="section-eyebrow reveal">${t(c.eyebrow)}</p>
        <h2 class="contact-title reveal">${t(c.title)}</h2>
        <p class="contact-sub reveal">${t(c.sub)}</p>
        <div class="contact-cards">
          ${cards.map((x, i) => {
            const inner = `
              <div class="contact-icon">${svg(x.icon, 20)}</div>
              <span class="contact-card-label">${t(x.label)}</span>
              <span class="contact-card-value">${x.value}</span>`;
            const delay = `style="transition-delay:${i * 60}ms"`;
            const ext = x.ext ? ' target="_blank" rel="noopener noreferrer"' : "";
            return x.href
              ? `<a class="contact-card reveal" href="${x.href}"${ext} ${delay}>${inner}</a>`
              : `<div class="contact-card contact-card--static reveal" ${delay}>${inner}</div>`;
          }).join("")}
        </div>
        <div class="contact-status reveal">
          <span class="status-dot"></span><span>${t(c.status)}</span>
        </div>
      </div>`;
  }

  /* ---------- FOOTER ---------- */
  function renderFooter() {
    const m = DATA.meta;
    el("footer").innerHTML = `
      <span>© ${new Date().getFullYear()} ${m.name} · ${t(m.role)}</span>
      <a href="${m.github.url}" target="_blank" rel="noopener">${m.github.handle}</a>`;
  }

  /* ---------- SLIDESHOW ---------- */
  const shows = {};
  function initSlideshows() {
    DATA.projects.items.forEach((p) => {
      if (!p.shots || !p.shots.length) return;
      const track = el(p.id + "Track");
      const dots = el(p.id + "Dots");
      const cap = el(p.id + "Caption");
      if (!track) return;
      track.innerHTML = "";
      if (dots) dots.innerHTML = "";
      shows[p.id] = { i: 0, total: p.shots.length, shots: p.shots };

      p.shots.forEach((s, i) => {
        const img = document.createElement("img");
        img.src = s.src;
        img.className = "slide-img";
        img.alt = s.alt || t(s.caption);
        img.loading = i === 0 ? "eager" : "lazy";
        img.decoding = "async";
        track.appendChild(img);
        if (dots) {
          const d = document.createElement("button");
          d.type = "button";
          d.className = "slide-dot" + (i === 0 ? " active" : "");
          d.setAttribute("aria-label", "Slide " + (i + 1));
          d.addEventListener("click", () => goTo(p.id, i));
          dots.appendChild(d);
        }
      });
      if (cap) cap.textContent = t(p.shots[0].caption);
    });

    document.querySelectorAll("[data-slide]").forEach((b) =>
      b.addEventListener("click", () => {
        const id = b.dataset.slide;
        goTo(id, shows[id].i + Number(b.dataset.dir));
      })
    );
  }

  function goTo(id, index) {
    const s = shows[id];
    if (!s) return;
    s.i = (index + s.total) % s.total;
    el(id + "Track").style.transform = `translateX(-${s.i * 100}%)`;
    const dots = el(id + "Dots");
    if (dots) dots.querySelectorAll(".slide-dot").forEach((d, i) => d.classList.toggle("active", i === s.i));
    const cap = el(id + "Caption");
    if (cap) cap.textContent = t(s.shots[s.i].caption);
  }

  /* ---------- REVEAL ---------- */
  let revealObs;
  function setupReveal(first) {
    if (revealObs) revealObs.disconnect();
    revealObs = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); }
      }),
      { threshold: 0.1, rootMargin: "0px 0px -6% 0px" }
    );
    document.querySelectorAll(".reveal").forEach((n) => {
      if (!first) {
        const r = n.getBoundingClientRect();
        if (r.top < innerHeight && r.bottom > 0) { n.style.transitionDelay = "0ms"; n.classList.add("in"); return; }
      }
      revealObs.observe(n);
    });
  }

  /* ---------- SCROLL SPY ---------- */
  let spyObs;
  function setupSpy() {
    if (spyObs) spyObs.disconnect();
    spyObs = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (!e.isIntersecting) return;
        document.querySelectorAll("[data-nav]").forEach((a) => a.classList.remove("active"));
        document.querySelectorAll(`[data-nav="${e.target.id}"]`).forEach((a) => a.classList.add("active"));
      }),
      { rootMargin: "-45% 0px -50% 0px" }
    );
    DATA.nav.forEach((n) => el(n.id) && spyObs.observe(el(n.id)));
  }

  /* ---------- EVENTS ---------- */
  function bind() {
    const burger = el("burger"), menu = el("navMobile");
    burger.onclick = () => {
      const open = menu.classList.toggle("open");
      burger.innerHTML = svg(open ? "close" : "menu", 18);
      burger.setAttribute("aria-expanded", String(open));
    };
    menu.querySelectorAll("a").forEach((a) =>
      a.addEventListener("click", () => {
        menu.classList.remove("open");
        burger.innerHTML = svg("menu", 18);
        burger.setAttribute("aria-expanded", "false");
      })
    );
    const themeBtn = el("themeBtn");
    themeBtn.onclick = () => {
      const root = document.documentElement;
      const light = root.classList.toggle("theme-light");
      root.classList.toggle("theme-dark", !light);
      try { localStorage.setItem("sa-theme", light ? "light" : "dark"); } catch (x) {}
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", light ? "#f7faff" : "#060e1c");
      themeBtn.setAttribute("aria-pressed", String(light));
    };
    themeBtn.setAttribute("aria-pressed", String(document.documentElement.classList.contains("theme-light")));

    document.querySelectorAll(".lang-btn").forEach((b) =>
      b.addEventListener("click", () => {
        if (b.dataset.lang === state.lang) return;
        state.lang = b.dataset.lang;
        localStorage.setItem("sa-lang", state.lang);
        render(false);
      })
    );
  }

  /* ---------- BOOT ---------- */
  function render(first) {
    document.documentElement.lang = state.lang;
    document.title = DATA.meta.name + " — " + t(DATA.meta.role);

    renderNav(); renderHero(); renderAbout(); renderSkills(); renderExperience(); renderJourney();
    renderProjects(); renderProduction(); renderEducation(); renderContact(); renderFooter();

    initSlideshows();
    bind();
    setupReveal(first);
    setupSpy();
  }

  render(true);
})();
</script>
</body>
</html>
